sonar.projectKey=demo-app
sonar.projectName=demo-app
sonar.projectVersion=1.0
sonar.sources=.
sonar.exclusions=venv/**,.venv/**,**/__pycache__/**,.pytest_cache/**,.scannerwork/**,**/test_*.py
sonar.tests=.
